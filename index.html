.wl{color:var(--acc);border-bottom:1px solid transparent}.wl:hover{border-color:currentColor}.wl.red{color:#c2410c}.wcats{margin-top:24px;padding-top:10px;border-top:1px solid var(--cardb)}
table.ibx{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid var(--cardb);border-radius:8px;overflow:hidden;margin-bottom:12px}.ibx caption{caption-side:top;text-align:center;font:600 15px Georgia,serif;padding:8px;background:var(--accw)}.ibx th{text-align:left;vertical-align:top;width:42%;padding:6px 8px;background:var(--card)}.ibx td{padding:6px 8px;border-top:1px solid var(--cardb)}.ibx tr+tr th{border-top:1px solid var(--cardb)}.wimg{display:block;max-width:100%;max-height:260px;margin:0 auto 10px;object-fit:contain}
.cert{border:2px double var(--acc);border-radius:8px;padding:18px;background:var(--card);margin-top:14px}
.dot.na{background:#9aa1ad}.cc>.dot{position:absolute;top:10px;right:10px}.cc h3{padding-right:30px}
</style>

<body>
<noscript><p style="padding:24px;font-family:sans-serif">O Cronolist precisa de JavaScript para funcionar.</p></noscript>
<div id="app"></div><div id="modal"></div><div id="toast" role="status" aria-live="polite"></div>
<div id="intro" aria-hidden="true"><div class="iw"><div class="iwm"><span style="--i:0">C</span><span style="--i:1">r</span><span style="--i:2">o</span><span style="--i:3">n</span><span style="--i:4">o</span><span class="b" style="--i:5">l</span><span class="b" style="--i:6">i</span><span class="b" style="--i:7">s</span><span class="b" style="--i:8">t</span></div><div class="iline"></div><p>Organização, consulta e história da TV brasileira.</p></div></div>
<script>
const $=s=>document.querySelector(s);
const CLAUDE=!!(window.claude&&claude.use);
const BUILD="2026-11-22-a";
const rows=(s,f)=>s.trim().split("\n").map(l=>f(l.split("|")));
const IC={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',pin:'<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',cal:'<path d="M7 3v4M17 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',dots:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',star:'<path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z"/>',tv:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/>',play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',x:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const FLAG={1:'<rect width="30" height="20" fill="#009c3b"/><path d="M15 3l11 7-11 7-11-7z" fill="#ffdf00"/><circle cx="15" cy="10" r="4" fill="#002776"/>',
2:'<rect width="30" height="20" fill="#fff"/>'+Array.from({length:7},(_,i)=>`<rect y="${i*40/13}" width="30" height="${20/13}" fill="#b22234"/>`).join("")+'<rect width="12" height="10.8" fill="#3c3b6e"/>',
3:'<rect width="30" height="20" fill="#74acdf"/><rect y="6.7" width="30" height="6.6" fill="#fff"/><circle cx="15" cy="10" r="1.8" fill="#f6b40e"/>',
4:'<rect width="10" height="20" fill="#0055a4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ef4135"/>',
5:'<rect width="30" height="6.7" fill="#000"/><rect y="6.7" width="30" height="6.6" fill="#dd0000"/><rect y="13.3" width="30" height="6.7" fill="#ffce00"/>',
6:'<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>',
7:'<rect width="12" height="20" fill="#006600"/><rect x="12" width="18" height="20" fill="#ff0000"/><circle cx="12" cy="10" r="3.2" fill="#ffd400"/>'};
const flagFb=(n,c)=>`<svg class="${c}" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#94a3b8"/><text x="15" y="10.5" text-anchor="middle" dominant-baseline="central" style="font:700 8px Inter,sans-serif;fill:#fff">${String(n||"").slice(0,3).toUpperCase()}</text></svg>`;
const flag=(id,c="fl")=>{const x=PX.find(p=>p.id===id);if(x&&x.logo)return `<img class="${c}" src="${ab(x.logo)}" alt="" loading="lazy">`;if(x&&x.url)return `<img class="${c}" src="${x.url}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fb="${String(x.nome||"").slice(0,3)}">`;return FLAG[id]?`<svg class="${c}" viewBox="0 0 30 20" aria-hidden="true">${FLAG[id]}</svg>`:flagFb((x||{}).nome,c)};
document.addEventListener("error",e=>{const i=e.target;if(i&&i.tagName==="IMG"&&i.dataset&&i.dataset.fb!=null){const w=document.createElement("span");w.innerHTML=flagFb(i.dataset.fb,i.className);i.replaceWith(w.firstChild)}},true);
const PAISES=rows(`1|Brasil
2|Estados Unidos
3|Argentina
4|França
5|Alemanha
6|Japão`,([id,nome])=>({id:+id,nome}));
const UFS=Object.fromEntries("AC:Acre,AL:Alagoas,AP:Amapá,AM:Amazonas,BA:Bahia,CE:Ceará,DF:Distrito Federal,ES:Espírito Santo,GO:Goiás,MA:Maranhão,MT:Mato Grosso,MS:Mato Grosso do Sul,MG:Minas Gerais,PA:Pará,PB:Paraíba,PR:Paraná,PE:Pernambuco,PI:Piauí,RJ:Rio de Janeiro,RN:Rio Grande do Norte,RS:Rio Grande do Sul,RO:Rondônia,RR:Roraima,SC:Santa Catarina,SP:São Paulo,SE:Sergipe,TO:Tocantins".split(",").map(x=>x.split(":")));
const REG={Norte:"AC AM AP PA RO RR TO",Nordeste:"AL BA CE MA PB PE PI RN SE","Centro-Oeste":"DF GO MT MS",Sudeste:"ES MG RJ SP",Sul:"PR RS SC"};
const CAT={a:"TV Aberta",f:"TV Fechada",s:"Streaming",x:"Extinta",l:"Regional",i:"Internacional",p:"Partido"};
const SLUG={aberta:"a",fechada:"f",streaming:"s",extintos:"x",partidos:"p"};
// ===== DADOS — vêm do banco (db) e são cadastrados no painel administrativo. emissoras: {id,nome,sig,cor,c,loc}; c = a|f|s|x|l|i|p; loc = UF (l) ou id do país (i)
const E=[];
const PX=[];const ALLP=()=>[...PAISES,...PX];
const paisOf=e=>e.c==="i"?+e.loc:1;
// cronologias: {id,nome,ano,dur,si:"Em Exibição"|"Fora do Ar",di:"Atualizado"|"Desatualizado"|"Indisponível",em:[ids]}
const CR=[];
const DC={Atualizado:"ok",Desatualizado:"wa",Indisponível:"ba"};
// Praças: PFMT = programa de praça de uma emissora (ex.: "Bom Dia Praça" da Globo) {id,em,nome}
const PFMT=[];
// JN = jornais do programa {id,f,nome,uf,em (emissora que exibe),desc,per}
const JN=[];
const MOD=rows(`1|Futebol|⚽
2|Automobilismo|🏎️
3|Basquete|🏀
4|Vôlei|🏐
5|Tênis|🎾
6|Handebol|🤾
7|Atletismo|🏃
8|Outros esportes|✨`,([id,nome,i])=>({id:+id,nome,i}));
// competições: {id,m,nome,cl:[classificações],ano,d,em:[ids]}
const COMP=[];
// agenda: {d:"AAAA-MM-DD",h,t,em,cat,st}
const AG=[];
// faixas: {em,nome,i,f,d:"dias 0-6",pr,desc}
const FX=[];
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const TABS=[["inicio","Início","home"],["pracas","Praças","pin"],["esportes","Esportes","trophy"],["programacao","Programação","cal"],["mais","Mais","dots"]];
const M0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),1)};
const ST={q:"",cat:"",pt:"c",pe:0,dia:new Date().getDay(),cal:{m:M0(),sel:null},th:"auto",f:{q:"",em:"",di:"",si:"",or:"data-recente",pg:1},bq:""};
const PER=12;
const nome=id=>(E.find(e=>e.id===id)||{}).nome||"";
const crOf=id=>CR.filter(c=>c.em.includes(id));
const HITS=()=>{try{return JSON.parse(localStorage.getItem("cl_hits")||"{}")}catch(e){return{}}};
let HDB={},HMINE={};const HM=()=>DBH?HDB:HITS();
function hit(id){if(!id)return;if(!CLAUDE)hitSb(id);try{const h=HITS();h[id]=(h[id]||0)+1;localStorage.setItem("cl_hits",JSON.stringify(h))}catch(e){}
 if(DBH&&UID){HMINE[id]=(HMINE[id]||0)+1;clearTimeout(hit.t);hit.t=setTimeout(()=>DBH.collection("hits").doc(UID).set({c:HMINE}).catch(()=>{}),1500)}}
const badge=e=>{if(e.logo)return `<img class="lgi" src="${ab(e.logo)}" alt="${e.nome}" loading="lazy" draggable="false">`;const s=e.sig||e.nome||"";return `<i class="bd" style="--c:${e.cor||"#2f7bff"};font-size:${s.length>8?9:s.length>5?11:s.length>3?13:16}px">${s}</i>`};
const sq=(e,rk,sub)=>`<a class="sq" href="#emissora-${e.id}">${rk?`<em class="rk">${rk}</em>`:""}${badge(e)}<span>${e.nome}</span>${sub?`<small class="sub">${sub}</small>`:""}</a>`;
const sqF=p=>`<a class="sq" href="#pais-${p.id}">${flag(p.id)}<span>${p.nome}</span></a>`;
const sc=(id,d)=>{const r=$("#"+id);r.scrollBy({left:d*r.clientWidth*.8,behavior:"smooth"})};
const car=(id,items)=>!items?`<div class="empty">${EMP()}</div>`:`<div class="car"><button class="ar l" aria-label="Anterior" data-do="sc" data-arg="${id}" data-arg2="-1">${ic("l")}</button><div class="row" id="${id}">${items}</div><button class="ar r" aria-label="Próximo" data-do="sc" data-arg="${id}" data-arg2="1">${ic("r")}</button></div>`;
const sec=(t,i,href,items,id)=>`<div class="sh"><h2>${ic(i,22)}${t}</h2><a class="va" href="#${href}">Ver todas ${ic("arr",14)}</a></div>${car(id,items)}`;
const tabs=(a,c)=>`<nav class="${c}" aria-label="Principal">${TABS.map(([h,t,i])=>`<a href="#${h}" class="${h===a?"on":""}">${ic(i,c==="bn"?24:18)}<span>${t}</span></a>`).join("")}</nav>`;
const page=(a,body,i)=>`<header class="hd"><div class="wrap hr"><a class="logo" href="#inicio" aria-label="Cronolist"><b class="wm">Crono<i>list</i></b></a><a class="wbtn" href="#cronopedia">Cronopedia</a><span class="hsp"></span>${tabs(a,"dn")}<span class="acts"><a class="ib" href="#busca" aria-label="Pesquisar">${ic("search")}</a><a class="ib" href="#mais" aria-label="Menu">${ic("menu")}</a></span></div></header><main class="wrap">${i?`<div class="sub"><a class="ib" href="#${i.back}" aria-label="Voltar">${ic("l",22)}</a><div><h1>${i.t}</h1><p class="cr">${i.cr.map(([l,h])=>h?`<a href="#${h}">${l}</a>`:l).join(" › ")}</p></div></div>`:""}${body}<footer class="ft"><b class="wm">Crono<i>list</i></b><nav class="fn"><a href="#inicio">Início</a><a href="#pracas">Praças</a><a href="#esportes">Esportes</a><a href="#programacao">Programação</a><a href="#cronopedia">Cronopedia</a><a href="#pede">Pede Aqui</a><a href="#plus">Cronolist +</a><a href="#cronologias">Cronologias</a></nav><small>© ${new Date().getFullYear()} Cronolist · Um site NovarkPlus · versão ${BUILD}</small></footer></main>${tabs(a,"bn")}`;
const ina=(t,back,cr)=>({t,back,cr:[["Início","inicio"],...cr]});

function vHome(){const all=CR.length,ok=CR.filter(c=>c.di==="Atualizado").length,p=all?Math.round(ok/all*100):0,h=HM();
 const top=E.filter(e=>"afxli".includes(e.c)).map(e=>({e,n:crOf(e.id).length,p:pctOf([e.id])})).filter(x=>x.n).sort((a,b)=>b.n-a.n||b.p-a.p||a.e.nome.localeCompare(b.e.nome)).slice(0,10);
 const by=c=>E.filter(e=>e.c===c).slice(0,10).map(e=>sq(e)).join("");
 return page("inicio",`<p class="tag">Organização, consulta e história da TV brasileira.</p><div class="pc"><p>Porcentagem de cronologias atualizadas</p><div class="pr"><div class="bar"><i style="--p:${p}%"></i></div><b>${p}%</b></div><span class="mut">${ok} de ${all} cronologias atualizadas</span></div>
 <div class="sh"><h2>${ic("star",22)}TOP 10 <small>· Mais cronologias e % atualizada</small></h2><a class="va" href="#lista-aberta">Acessar todas ${ic("arr",14)}</a></div>${car("t10",top.map((x,i)=>sq(x.e,i+1,x.n+" · "+x.p+"%")).join(""))}
 <a class="cta" href="#cronologias">${ic("cal",28)}<div>ACESSAR TODAS AS CRONOLOGIAS<small>Pesquisa, filtros, status e datas</small></div></a>
 <a class="card" href="#pede" style="display:flex;align-items:center;gap:12px;margin-top:14px"><div style="flex:1"><b style="font:700 17px Sora,sans-serif">Pede Aqui</b><p class="mut" style="margin:2px 0 0">Cronologias pedidas ao canal · ${PED.length} pedido${PED.length!==1?"s":""} · ${PED.filter(x=>x.st==="Realizado").length} realizado${PED.filter(x=>x.st==="Realizado").length!==1?"s":""}</p></div>${ic("arr",18)}</a>
 <div class="sh"><h2>Cronolist +</h2><a class="va" href="#plus">Ver tudo ${ic("arr",14)}</a></div><div class="lst c3">${PLUS.map(([h,t,d])=>`<a class="card" href="#${h}"><h3>${t}</h3><p>${d}</p></a>`).join("")}</div>
 <div class="sh big"><h2>Geral</h2></div>
 ${sec("TV Aberta","tv","lista-aberta",by("a"),"ca")}${sec("TV Fechada","tv","lista-fechada",by("f"),"cf")}${sec("Streaming","play","lista-streaming",by("s"),"cs")}${sec("Extintos","x","lista-extintos",by("x"),"cx")}
 <div class="sh"><h2>${ic("pin",22)}Regionais</h2></div>${car("cr",Object.keys(REG).map(sqR).join(""))}
 ${sec("Nacionais / Internacionais","globe","lista-paises",ALLP().map(sqF).join(""),"cp")}${sec("Partidos","flag","lista-partidos",by("p"),"cpa")}`)}

function drawList(c){const q=ST.q.toLowerCase(),l=(c==="paises"?ALLP():E.filter(e=>e.c===SLUG[c])).filter(e=>!q||e.nome.toLowerCase().includes(q));
 $("#res").innerHTML=`<p class="mut">${l.length} registro${l.length!==1?"s":""}</p>`+(l.length?`<div class="eg">${l.map(e=>c==="paises"?sqF(e):sq(e)).join("")}</div>`:`<p class="mut c mt">${q?"Nada encontrado.":EMP()}</p>`)}
function vLista(c){const t={aberta:"TV Aberta",fechada:"TV Fechada",streaming:"Streaming",extintos:"Extintos",partidos:"Partidos",paises:"Nacionais / Internacionais"}[c];
 return page("inicio",`<input class="mt" placeholder="Pesquisar em ${t}..." value="${ST.q}" data-in="listq" data-arg="${c}"><div id="res"></div>`,ina(t,"inicio",[[t,null]]))}
function vEmissora(id){const e=E.find(x=>x.id===id);if(!e)return vHome();const l=crOf(id),pr=PFMT.filter(p=>p.em===id);
 const back=e.c==="l"?"estado-"+e.loc:e.c==="i"?"pais-"+e.loc:"lista-"+{a:"aberta",f:"fechada",s:"streaming",x:"extintos",p:"partidos"}[e.c];
 const info=e.c==="l"?UFS[e.loc]:e.c==="i"?(ALLP().find(p=>p.id===+e.loc)||{}).nome||"":"";
 return page("inicio",`<div class="card hero">${badge(e)}<div><h2>${e.nome}</h2><span class="pill ok">${CAT[e.c]}</span>${ADM?` <button class="btn sm" data-do="edit" data-arg="E" data-arg2="${e.id}">Editar</button>`:""}${info?`<p class="mut">${info}</p>`:""}</div></div>
 ${pr.length?`<a class="cta" href="#prem-${id}">${ic("pin",24)}<div>Ver praças e telejornais<small>${pr.length} praça(s)</small></div></a>`:""}
 <div class="sh"><h2>Cronologias (${l.length})</h2></div>${l.length?`<div class="lst c3">${l.map(c=>`<div class="card cc ${DC[c.di]}"><h3>${c.nome}</h3>${dot(c.di!=="Indisponível")}<span class="pill ${DC[c.di]}">${c.di}</span><p>${c.si} · Estreia: ${c.ano}</p><p>Duração: ${c.dur}</p></div>`).join("")}</div>`:`<p class="mut">Nenhuma cronologia cadastrada para este registro.</p>`}`,ina(e.nome,back,[[CAT[e.c],back],[e.nome,null]]))}
function vRegiao(r){if(!REG[r])return vHome();return page("inicio",`${regMap(r)}<div class="sg">${REG[r].split(" ").map(u=>{const n=E.filter(e=>e.c==="l"&&e.loc===u).length;return `<a class="stt" href="#estado-${u}"><b>${u}</b>${UFS[u]}<br><span class="mut">${n} emissora${n!==1?"s":""}</span></a>`}).join("")}</div>`,ina(r,"inicio",[["Regionais",null],[r,null]]))}
function vEstado(u){const reg=Object.keys(REG).find(r=>REG[r].split(" ").includes(u)),l=E.filter(e=>e.c==="l"&&e.loc===u);
 return page("inicio",l.length?`<div class="eg">${l.map(e=>sq(e)).join("")}</div>`:`<p class="mut c mt">Nenhuma emissora cadastrada neste estado.</p>`,ina(UFS[u]||u,"regiao-"+reg,[[reg,"regiao-"+reg],[UFS[u]||u,null]]))}
function vPais(id){const p=ALLP().find(x=>x.id===id);if(!p)return vHome();const l=E.filter(e=>paisOf(e)===id&&"afxli".includes(e.c));
 return page("inicio",`<div class="card hero">${flag(id,"fl big-fl")}<div><h2>${p.nome}</h2><p class="mut">${l.length} emissora(s)</p></div></div>${l.length?`<div class="eg">${l.map(e=>sq(e)).join("")}</div>`:`<p class="mut c">Nenhuma emissora cadastrada.</p>`}`,ina(p.nome,"lista-paises",[["Nacionais / Internacionais","lista-paises"],[p.nome,null]]))}

const sel=(f,o,v)=>`<select data-ch="filt" data-arg="${f}">${o.map(([a,b])=>`<option value="${a}"${String(a)===String(v)?" selected":""}>${b}</option>`).join("")}</select>`;
function setF(f,v){ST.f[f]=v;if(f!=="pg")ST.f.pg=1;drawCron()}
function drawCron(){const f=ST.f,q=f.q.toLowerCase();let l=CR.filter(c=>(!q||c.nome.toLowerCase().includes(q))&&(!f.em||c.em.includes(+f.em))&&(!f.di||c.di===f.di)&&(!f.si||c.si===f.si));
 const y=c=>+c.ano||0;l.sort(f.or==="alfabetica"?(a,b)=>a.nome.localeCompare(b.nome):f.or==="ordem-cronologica"?(a,b)=>y(a)-y(b):(a,b)=>y(b)-y(a));
